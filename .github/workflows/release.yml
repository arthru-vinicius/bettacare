name: Release

# Disparado por tag `v*`. Publicar é uma decisão explícita — não acontece por
# merge na main, e o servidor nunca puxa uma imagem que ninguém marcou.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Validar a tag
        id: versao
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # `v1.2.3` e nada além disso. Uma tag torta viraria uma imagem que o
          # playbook do homelab não sabe referenciar.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$TAG' fora do formato vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publicando $TAG"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          # O servidor é Debian 13 amd64. Uma imagem multi-arch só custaria
          # tempo de build para uma plataforma que ninguém vai usar.
          platforms: linux/amd64
          push: true
          # Duas tags, e **nunca `latest`**: sem versão não há como saber o que
          # está rodando nem voltar atrás. A segunda amarra a imagem ao commit.
          tags: |
            ghcr.io/arthru-vinicius/bettacare:${{ steps.versao.outputs.tag }}
            ghcr.io/arthru-vinicius/bettacare:sha-${{ github.sha }}
          build-args: |
            BUILD_ID=${{ github.sha }}
            MIN_BUILD=${{ vars.MIN_BUILD }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.versao.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          {
            echo "## Imagem publicada"
            echo
            echo '```'
            echo "ghcr.io/arthru-vinicius/bettacare:${{ steps.versao.outputs.tag }}"
            echo '```'
            echo
            echo "- commit: \`${{ github.sha }}\`"
            echo "- plataforma: \`linux/amd64\`"
            echo "- uid do processo: \`1000:1000\`"
            echo
            echo "No servidor, atualize a tag em \`/opt/compose/bettacare/\` e"
            echo "rode \`docker compose up -d\`. A atualização é manual por decisão:"
            echo "Watchtower está proibido no stack."
          } >> "$GITHUB_STEP_SUMMARY"
